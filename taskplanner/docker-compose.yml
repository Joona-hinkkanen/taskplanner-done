# TaskPlanner: Django-sovellus + PostgreSQL
# Käyttö:  docker compose up --build
# Avaa:    http://localhost:8000/
name: taskplanner

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-taskplanner}
      POSTGRES_USER: ${DB_USER:-taskplanner}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-taskplanner}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-taskplanner} -d ${DB_NAME:-taskplanner}"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build: .
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      SECRET_KEY: ${SECRET_KEY:-dev-secret-key-change-me}
      DEBUG: ${DEBUG:-False}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-localhost 127.0.0.1 0.0.0.0}
      DB_ENGINE: django.db.backends.postgresql
      DB_NAME: ${DB_NAME:-taskplanner}
      DB_USER: ${DB_USER:-taskplanner}
      DB_PASSWORD: ${DB_PASSWORD:-taskplanner}
      DB_HOST: db
      DB_PORT: 5432
      DJANGO_SUPERUSER_USERNAME: ${DJANGO_SUPERUSER_USERNAME:-admin}
      DJANGO_SUPERUSER_EMAIL: ${DJANGO_SUPERUSER_EMAIL:-admin@example.com}
      DJANGO_SUPERUSER_PASSWORD: ${DJANGO_SUPERUSER_PASSWORD:-admin}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/admin/login/', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

volumes:
  pgdata:
